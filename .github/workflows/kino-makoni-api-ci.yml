# Kino Makoni — Backend (FastAPI) CI
#
# Faqat "kino-makoni/backend/**" o'zgarganda ishlaydi. Repo ildizidagi eski
# Telegram bot (Railway) bilan bog'liq emas.

name: Kino Makoni API CI

on:
  push:
    paths:
      - "kino-makoni/backend/**"
      - ".github/workflows/kino-makoni-api-ci.yml"
  pull_request:
    paths:
      - "kino-makoni/backend/**"
      - ".github/workflows/kino-makoni-api-ci.yml"

concurrency:
  group: kino-makoni-api-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: kino-makoni/backend
    shell: bash

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: kino-makoni/backend/requirements-dev.txt

      - name: Bog'liqliklarni o'rnatish
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Pytest
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dockerfile mavjudligini tekshirish
        id: check
        run: |
          set -euo pipefail
          if [ -f Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::kino-makoni/backend/Dockerfile hali yo'q — docker build o'tkazib yuborildi (backend agenti hali qo'shmagan)."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Docker image build (push YO'Q — faqat build tekshiruvi)
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: kino-makoni/backend
          push: false
          tags: kino-makoni-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
